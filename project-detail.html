<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Project Details | Kaghan Properties</title>
    <meta name="description" content="Explore project details, available plots, payment schedules, and interactive pinned plot map.">
    <meta name="theme-color" content="#077943">
    <link rel="canonical" href="https://kaghanproperties.com/project-detail.html">

    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/shared.js"></script>
    <script src="assets/js/plot-map.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="site-header"></div>

    <main id="project-main" class="market-container py-8 flex-1 space-y-12">
        <!-- 1. DYNAMIC PROJECT HEADER & COVER IMAGE (100% from Firestore) -->
        <section class="bg-white rounded-3xl border-2 border-slate-300 p-5 sm:p-7 space-y-5 shadow-sm">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="space-y-1">
                    <span id="proj-hero-badge" class="inline-block text-[11px] font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full">Loading...</span>
                    <h1 id="proj-hero-title" class="text-2xl sm:text-4xl font-extrabold outfit text-slate-900">Loading project...</h1>
                    <p id="proj-hero-subtitle" class="text-xs sm:text-sm text-slate-500"></p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <a href="#location" class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5">
                        <i class="fa-solid fa-map-pin text-emerald-400"></i> Plot Map
                    </a>
                    <a id="proj-wa-btn" href="contact.html" target="_blank" rel="noopener" class="shared-wa-link px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5">
                        <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                    </a>
                </div>
            </div>

            <div id="proj-cover-wrap" class="rounded-2xl overflow-hidden border-2 border-slate-200 bg-slate-100 h-64 sm:h-[400px] flex items-center justify-center">
                <img id="proj-cover-img" src="" alt="Project Cover" class="hidden w-full h-full object-cover">
                <i id="proj-cover-placeholder" class="fa-solid fa-city text-5xl text-slate-300"></i>
            </div>

            <p id="proj-hero-desc" class="hidden text-xs sm:text-sm text-slate-600 leading-relaxed pt-1"></p>
        </section>

        <!-- 2. INTERACTIVE PINNED PLOT MAP (Strictly Project Listings from Firestore) -->
        <section id="location" class="scroll-mt-28 space-y-4">
            <div class="pb-3 border-b-2 border-slate-200">
                <h2 class="text-2xl font-extrabold outfit text-slate-900">Pinned Plot Map</h2>
                <p class="text-xs sm:text-sm text-slate-500">Scroll or pinch to zoom and click any pinned listing to view details.</p>
            </div>
            <div id="project-plot-map-root"></div>
        </section>

        <!-- 3. DYNAMIC PAYMENT PLANS (Rendered ONLY from Firestore proj.paymentPlans) -->
        <section id="payment-plan" class="hidden scroll-mt-28 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 pb-3 border-b-2 border-slate-200">
                <h2 class="text-2xl font-extrabold outfit text-slate-900">Official Payment Plans</h2>
                <div id="plan-tabs-bar" class="flex flex-wrap gap-1.5 text-xs"></div>
            </div>
            <div id="plan-tables-root"></div>
        </section>

        <!-- 4. ASSIGNED LISTINGS GRID (Strictly from Firestore) -->
        <section class="space-y-4">
            <div class="flex items-center justify-between pb-3 border-b-2 border-slate-200">
                <h2 class="text-2xl font-extrabold outfit text-slate-900">Available Listings</h2>
                <a href="projects.html" class="text-xs font-extrabold text-emerald-700 hover:underline">All Listings &rarr;</a>
            </div>
            <div id="project-plots-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- 5. DIRECT INQUIRY BOX (Contact hydrated from Firestore) -->
        <section id="request-call-box" class="bg-white rounded-3xl border-2 border-slate-300 p-6 sm:p-8 max-w-2xl mx-auto space-y-4 shadow-sm">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-extrabold outfit text-slate-900">Book a Plot or Site Visit</h2>
                <p class="text-xs text-slate-500">Call <a href="contact.html" class="shared-phone-link font-bold text-emerald-700"><span class="shared-phone-text">our office</span></a> or request a quick callback.</p>
            </div>
            <form onsubmit="handleProjectLead(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
                <input type="text" id="lead-name" required placeholder="Full Name" class="bg-slate-50 border-2 border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600">
                <input type="tel" id="lead-phone" required placeholder="Phone / WhatsApp" class="bg-slate-50 border-2 border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600">
                <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 border-2 border-emerald-800 text-white font-bold rounded-xl py-2.5 px-4">Request Callback</button>
            </form>
            <div id="lead-feedback" class="hidden text-center text-xs font-bold text-emerald-700"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script>
        let currentProject = null;
        let siteSettings = {};

        function escHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        function getCardImage(p) {
            if (Array.isArray(p.images) && p.images.length) {
                const first = p.images.find(i => !i.type || i.type === 'image') || p.images[0];
                if (first) return typeof first === 'string' ? first : (first.url || '');
            }
            if (Array.isArray(p.gallery)) {
                const img = p.gallery.find(g => g.type === 'image' && g.url);
                if (img) return img.url;
            }
            return '';
        }

        function hasListingVideo(p) {
            return (Array.isArray(p.videos) && p.videos.length > 0) ||
                   (Array.isArray(p.gallery) && p.gallery.some(g => g.type === 'video'));
        }

        function renderDynamicPaymentPlans(plans) {
            const sec = document.getElementById('payment-plan');
            const bar = document.getElementById('plan-tabs-bar');
            const root = document.getElementById('plan-tables-root');
            if (!Array.isArray(plans) || !plans.length) {
                sec.classList.add('hidden');
                return;
            }
            sec.classList.remove('hidden');

            bar.innerHTML = plans.map((pl, i) => `
                <button type="button" onclick="selectPlanTab(${i})" id="plan-btn-${i}" class="px-3.5 py-2 rounded-xl font-bold ${i === 0 ? 'bg-emerald-700 text-white' : 'bg-white border-2 border-slate-300 text-slate-700'}">
                    ${escHtml(pl.title || ('Plan ' + (i + 1)))}
                </button>
            `).join('');

            root.innerHTML = plans.map((pl, i) => {
                const cols = Array.isArray(pl.columns) ? pl.columns : [];
                const rows = Array.isArray(pl.rows) ? pl.rows : [];
                return `
                    <div id="plan-tab-${i}" class="${i === 0 ? '' : 'hidden'} bg-white rounded-2xl border-2 border-slate-300 overflow-x-auto shadow-xs">
                        <table class="w-full text-left text-xs min-w-[600px]">
                            <thead class="bg-slate-900 text-white uppercase text-[11px]">
                                <tr>${cols.map((c, ci) => `<th class="p-3.5 ${ci > 0 ? 'text-right' : ''}">${escHtml(c)}</th>`).join('')}</tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 font-medium">
                                ${rows.map(r => `<tr class="hover:bg-slate-50">${(Array.isArray(r) ? r : []).map((cell, ci) => `<td class="p-3.5 ${ci === 0 ? 'font-bold text-slate-900' : 'text-right'}">${escHtml(cell)}</td>`).join('')}</tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }).join('');
        }

        function selectPlanTab(idx) {
            const tabs = document.querySelectorAll('[id^="plan-tab-"]');
            tabs.forEach((el, i) => {
                el.classList.toggle('hidden', i !== idx);
                const btn = document.getElementById('plan-btn-' + i);
                if (btn) {
                    btn.className = i === idx
                        ? 'px-3.5 py-2 rounded-xl font-bold bg-emerald-700 text-white'
                        : 'px-3.5 py-2 rounded-xl font-bold bg-white border-2 border-slate-300 text-slate-700';
                }
            });
        }

        async function handleProjectLead(e) {
            e.preventDefault();
            const fb = document.getElementById('lead-feedback');
            try {
                await window.KaghanDB.createLead({
                    name: document.getElementById('lead-name').value.trim(),
                    phone: document.getElementById('lead-phone').value.trim(),
                    propertyTitle: currentProject ? currentProject.name : 'Project Inquiry',
                    sourcePage: window.location.href,
                    status: 'new'
                });
                fb.innerText = 'Request received! Our advisor will call shortly.';
                fb.classList.remove('hidden');
                e.target.reset();
            } catch (err) {
                fb.innerText = 'Could not send request. Please try again.';
                fb.classList.remove('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug') || params.get('id');

            const [settings, allProjs, allProps] = await Promise.all([
                window.KaghanDB.getSiteSettings(),
                window.KaghanDB.getProjects(false),
                window.KaghanDB.getProperties({ status: 'published' })
            ]);
            siteSettings = settings || {};

            if (slug) {
                const norm = slug.toLowerCase().trim();
                currentProject = allProjs.find(pr => (pr.slug || '').toLowerCase() === norm || String(pr.id || '').toLowerCase() === norm) || null;
            }
            if (!currentProject && allProjs.length > 0) {
                currentProject = allProjs[0];
            }

            if (!currentProject) {
                document.getElementById('project-main').innerHTML = `
                    <div class="bg-white p-12 text-center rounded-2xl border-2 border-slate-300 max-w-md mx-auto my-12 space-y-3">
                        <h2 class="text-lg font-extrabold outfit text-slate-900">Project Not Found</h2>
                        <p class="text-xs text-slate-500">Create projects inside the Admin Panel to display them here.</p>
                        <a href="projects.html" class="inline-block bg-emerald-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl">Browse Listings</a>
                    </div>`;
                return;
            }

            document.title = `${currentProject.name} | ${(siteSettings && siteSettings.siteName) || 'Project'}`;
            document.getElementById('proj-hero-title').innerText = currentProject.name;
            document.getElementById('proj-hero-badge').innerText = [currentProject.location, currentProject.city].filter(Boolean).join(' • ') || 'Project';
            document.getElementById('proj-hero-subtitle').innerText = currentProject.startingPrice ? `Starting from ${currentProject.startingPrice}` : '';

            const phoneDigits = ((siteSettings.contact && siteSettings.contact.phone) || '').replace(/[^0-9]/g, '');
            const waBtn = document.getElementById('proj-wa-btn');
            if (waBtn && phoneDigits) {
                waBtn.href = `https://wa.me/${phoneDigits}?text=${encodeURIComponent('Hi, I want details for ' + currentProject.name + '.')}`;
            }

            if (currentProject.coverImage) {
                const coverImg = document.getElementById('proj-cover-img');
                coverImg.src = currentProject.coverImage;
                coverImg.alt = currentProject.name;
                coverImg.classList.remove('hidden');
                document.getElementById('proj-cover-placeholder').classList.add('hidden');
            }

            if (currentProject.description) {
                const descEl = document.getElementById('proj-hero-desc');
                descEl.innerText = currentProject.description;
                descEl.classList.remove('hidden');
            }

            renderDynamicPaymentPlans(currentProject.paymentPlans);

            const props = allProps.filter(p => p.projectId === currentProject.id || (!p.projectId && p.societyId === currentProject.id));

            if (window.KaghanPlotMap) {
                window.KaghanPlotMap.create('project-plot-map-root', {
                    mode: 'multi',
                    properties: props,
                    emapUrl: currentProject.emapUrl || '',
                    height: '520px'
                });
            }

            const grid = document.getElementById('project-plots-grid');
            if (grid) {
                if (!props.length) {
                    grid.innerHTML = `<div class="col-span-full bg-white p-10 rounded-2xl border-2 border-slate-300 text-center text-slate-500 text-xs">No listings assigned to this project in Firestore yet.</div>`;
                } else {
                    grid.innerHTML = props.map(p => {
                        const img = getCardImage(p);
                        const hasVid = hasListingVideo(p);
                        const u = String((p && (p.urgency || p.badge)) || '').toLowerCase().trim();
                        const badgeHtml = u === 'superhot'
                            ? `<span class="badge-urgency-superhot inline-flex items-center gap-1"><i class="fa-solid fa-fire-flame-curved"></i> Super Hot</span>`
                            : (u === 'hot' ? `<span class="badge-urgency-hot inline-flex items-center gap-1"><i class="fa-solid fa-fire"></i> Hot</span>` : '');
                        const price = window.KaghanSharedUI ? window.KaghanSharedUI.formatPrice(p.price) : `PKR ${Number(p.price || 0).toLocaleString()}`;
                        const url = `property.html?slug=${encodeURIComponent(p.slug || p.id)}`;
                        return `
                            <article class="kp-card ${u === 'superhot' ? 'ring-2 ring-red-500/40' : ''} rounded-2xl overflow-hidden flex flex-col">
                                <a href="${url}" class="relative h-44 bg-slate-100 flex items-center justify-center overflow-hidden border-b-2 border-slate-200">
                                    ${img
                                        ? `<img src="${escHtml(img)}" alt="${escHtml(p.title)}" loading="lazy" class="w-full h-full object-cover">`
                                        : `<i class="fa-solid fa-image text-3xl text-slate-300"></i>`}
                                    <div class="absolute top-3 left-3 flex flex-wrap items-center gap-1.5">
                                        ${badgeHtml}
                                        ${p.plotNumber ? `<span class="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-map-pin text-[10px] mr-1"></i>${escHtml(p.plotNumber)}</span>` : ''}
                                    </div>
                                    ${hasVid ? `<span class="absolute top-3 right-3 bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow flex items-center gap-1"><i class="fa-brands fa-youtube"></i> Video</span>` : ''}
                                </a>
                                <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                                    <div>
                                        <div class="text-lg font-extrabold outfit text-emerald-800">${escHtml(price)}</div>
                                        <h3 class="font-bold text-sm text-slate-900 line-clamp-1"><a href="${url}">${escHtml(p.title)}</a></h3>
                                        <div class="text-xs text-slate-500">${escHtml(p.plotDimensions || (p.sqYards ? p.sqYards + ' Sq Yds' : (p.size ? p.size + ' ' + (p.sizeUnit || '') : '')))}</div>
                                    </div>
                                    <a href="${url}" class="mt-2 block text-center py-2 rounded-xl bg-slate-900 hover:bg-emerald-700 text-white text-xs font-bold transition-colors">View Plot &amp; Map</a>
                                </div>
                            </article>
                        `;
                    }).join('');
                }
            }
        });
    </script>
</body>
</html>
