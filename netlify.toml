"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "."

[functions]
  node_bundler = "esbuild"
  included_files = [
    "index.html",
    "projects.html",
    "property.html",
    "project-detail.html",
    "about.html",
    "contact.html",
    "blog.html"
  ]

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

# Redirect /stay/* paths on main domains to stay subdomain
[[redirects]]
  host = "kaghanproperties.com"
  from = "/stay/*"
  to = "https://stay.kaghanproperties.com/:splat"
  status = 301
  force = true

[[redirects]]
  host = "kaghannew.com"
  from = "/stay/*"
  to = "https://stay.kaghannew.com/:splat"
  status = 301
  force = true

[[redirects]]
  host = "kaghan-new.com"
  from = "/stay/*"
  to = "https://stay.kaghan-new.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/stay/*"
  to = "https://stay.kaghanproperties.com/:splat"
  status = 301
  force = true

# Admin & Legal Clean URLs
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy.html"
  to = "/privacy-policy.html"
  status = 301

# ==============================================================================
# SUPER-FAST BROWSER & CDN CACHING HEADERS FOR STATIC ASSETS
# (SSR dynamic HTML routes set Netlify-CDN-Cache-Control: durable in ssr.mjs)
# ==============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable long-term browser cache for images, icons & media (1 year)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/cad-tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fast browser cache + Stale-While-Revalidate for CSS & JS bundles
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Always fetch fresh Service Worker & Admin Panel
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
