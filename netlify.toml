# Redirect /stay/* paths on main domains to their stay subdomain counterparts
[[redirects]]
  host = "kaghanproperties.com"
  from = "/stay/*"
  to = "https://stay.kaghanproperties.com/:splat"
  status = 301
  force = true

[[redirects]]
  host = "kaghannew.com"
  from = "/stay/*"
  to = "https://stay.kaghannew.com/:splat"
  status = 301
  force = true

[[redirects]]
  host = "kaghan-new.com"
  from = "/stay/*"
  to = "https://stay.kaghan-new.com/:splat"
  status = 301
  force = true

# Default fallback redirect for other domains (e.g. Netlify deployment URL)
[[redirects]]
  from = "/stay/*"
  to = "https://stay.kaghanproperties.com/:splat"
  status = 301
  force = true

# Clean URLs rewrites for Admin and Properties
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/property/:slug"
  to = "/property.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/property/*"
  to = "/property.html"
  status = 200

[[redirects]]
  from = "/area/:slug"
  to = "/area.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/area/*"
  to = "/area.html"
  status = 200

