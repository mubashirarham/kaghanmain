                        <textarea id="lead-message" rows="2" placeholder="Message" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-emerald-600"></textarea>
                        <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 border-2 border-emerald-800 text-white font-bold transition-colors">
                            Send Inquiry

    <!-- Lightbox Modal -->
    <div id="gallery-lightbox-modal" class="lightbox-modal" onclick="if(event.target === this) closeLightbox()">
        <div class="relative max-w-5xl w-full p-4 flex flex-col items-center">

                <button onclick="changeLightboxPhoto(1)" class="absolute right-2 w-10 h-10 rounded-full bg-slate-900/80 text-white hover:bg-emerald-600"><i class="fa-solid fa-chevron-right"></i></button>

    <!-- Mobile Sticky Bottom CTA -->
    <div class="mobile-sticky-cta md:hidden">

            <span class="text-[10px] text-slate-400 font-bold uppercase block">Price</span>

        <div class="flex items-center gap-2">
            <a id="mobile-cta-call" href="tel:+923340091127" class="btn-primary text-xs py-2 px-3.5 rounded-xl font-bold">Call</a>
            <a id="mobile-cta-wa" href="https://wa.me/923340091127" target="_blank" class="btn-whatsapp text-xs py-2 px-3.5 rounded-xl font-bold">WhatsApp</a>
        </div>

    <div id="site-footer"></div>

    <script>
        let currentProperty = null;
        let currentMedia = [];
        let photoOnlyList = [];
        let currentMediaIndex = 0;
        let currentLightboxPhotoIdx = 0;

        function fmtPrice(val) {
            return window.KaghanSharedUI ? window.KaghanSharedUI.formatPrice(val) : ('PKR ' + Number(val || 0).toLocaleString());
        }

        function extractYouTubeId(input) {
            if (!input) return null;
            if (window.KaghanDB && window.KaghanDB.extractYouTubeId) {
                return window.KaghanDB.extractYouTubeId(input);
            }
            const trimmed = String(input).trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            const m = trimmed.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : null;
        }

        function buildPropertyMedia(p) {
            const media = [];
            if (Array.isArray(p.gallery) && p.gallery.length > 0) {
                p.gallery.forEach(item => {
                    if (!item) return;
                    if (item.type === 'video') {
                        const vid = item.videoId || extractYouTubeId(item.url);
                        if (vid) {
                            media.push({
                                type: 'video',
                                videoId: vid,
                                url: item.url || `https://www.youtube.com/watch?v=${vid}`,
                                thumbnail: item.thumbnail || `https://img.youtube.com/vi/${vid}/hqdefault.jpg`
                            });
                        }
                    } else {
                        const u = typeof item === 'string' ? item : item.url;
                        if (u) media.push({ type: 'image', url: u });
                    }
                });
            } else {
                (p.images || []).forEach(img => {
                    const u = typeof img === 'string' ? img : (img && img.url);
                    if (u) media.push({ type: 'image', url: u });
                });
                (p.videos || []).forEach(v => {
                    const vid = (v && v.videoId) || extractYouTubeId(typeof v === 'string' ? v : (v && v.url));
                    if (vid) {
                        media.push({
                            type: 'video',
                            videoId: vid,
                            url: (v && v.url) || `https://www.youtube.com/watch?v=${vid}`,
                            thumbnail: (v && v.thumbnail) || `https://img.youtube.com/vi/${vid}/hqdefault.jpg`
                        });
                    }
                });
            }
            if (media.length === 0) {
                media.push({ type: 'image', url: 'assets/images/dha-margalla-hero.jpg' });
            }
            return media;
        }

        async function populateUI(p) {
            document.title = `${p.title} | Kaghan Properties`;
            document.getElementById('detail-h1').innerText = p.title;
            const crumbEl = document.getElementById('crumb-society');
            crumbEl.innerText = p.area || 'DHA Margalla Enclave';
            if ((p.projectId || p.societyId) && window.KaghanDB && window.KaghanDB.getProjectBySlugOrId) {
                const proj = await window.KaghanDB.getProjectBySlugOrId(p.projectId || p.societyId);
                if (proj) {
                    crumbEl.innerText = proj.name;
                    crumbEl.href = `project-detail.html?slug=${encodeURIComponent(proj.slug || proj.id)}`;
                }
            }
            document.getElementById('detail-address').innerHTML = `<i class="fa-solid fa-location-dot text-emerald-600"></i> ${[p.plotStreet, p.plotSector || p.sector, p.area, p.city].filter(Boolean).join(', ')}`;

            const plotPill = document.getElementById('detail-plot-pill');
            if (p.plotNumber) {
                plotPill.innerHTML = `<i class="fa-solid fa-map-pin text-[10px]"></i> ${p.plotNumber}`;
                plotPill.classList.remove('hidden');
            }
            document.getElementById('detail-cat-pill').innerText = p.category || p.type || 'Plot';

            // Prices & Specs
            const priceStr = fmtPrice(p.price);
            document.getElementById('rail-price').innerText = priceStr;
            document.getElementById('mobile-cta-price').innerText = priceStr;
            if (p.lumpSumPrice) {
                document.getElementById('rail-lumpsum').innerText = `Lump Sum: ${fmtPrice(p.lumpSumPrice)}`;
            }

            document.getElementById('spec-plot').innerText = p.plotNumber || 'Allotted';
            document.getElementById('spec-size').innerText = p.plotDimensions || (p.sqYards ? `${p.sqYards} Sq Yds` : `${p.size || ''} ${p.sizeUnit || 'Marla'}`);
            document.getElementById('spec-dp').innerText = p.downPaymentAmount ? fmtPrice(p.downPaymentAmount) : (p.installments?.advance ? fmtPrice(p.installments.advance) : '20% Down');
            document.getElementById('spec-qtr').innerText = p.quarterlyAmount ? fmtPrice(p.quarterlyAmount) : (p.installments?.monthly ? fmtPrice(p.installments.monthly) : 'Quarterly');

            // Contacts
            const phone = p.agentPhone || '+923340091127';
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const waMsg = encodeURIComponent(`Hi, I am interested in ${p.title}${p.plotNumber ? ' (' + p.plotNumber + ')' : ''} — ${priceStr}.`);
            const waHref = `https://wa.me/${cleanPhone}?text=${waMsg}`;
            ['rail-call-btn', 'mobile-cta-call'].forEach(id => { const el = document.getElementById(id); if (el) el.href = `tel:${phone}`; });
            ['rail-wa-btn', 'mobile-cta-wa'].forEach(id => { const el = document.getElementById(id); if (el) el.href = waHref; });
            document.getElementById('lead-message').value = `I'm interested in ${p.title}${p.plotNumber ? ' (' + p.plotNumber + ')' : ''}.`;

            // Unified Gallery (Photos + YouTube Videos)
            currentMedia = buildPropertyMedia(p);
            photoOnlyList = currentMedia.filter(m => m.type === 'image');
            const photoCount = photoOnlyList.length;
            const videoCount = currentMedia.length - photoCount;
            const countParts = [];
            if (photoCount) countParts.push(`${photoCount} Photo${photoCount > 1 ? 's' : ''}`);
            if (videoCount) countParts.push(`${videoCount} Video${videoCount > 1 ? 's' : ''}`);
            document.getElementById('gallery-photo-count').innerText = countParts.join(' • ') || '1 Photo';

            document.getElementById('gallery-filmstrip').innerHTML = currentMedia.map((item, idx) => {
                const isVideo = item.type === 'video';
                const thumbSrc = isVideo ? item.thumbnail : item.url;
                return `
                    <div onclick="selectMedia(${idx})" id="thumb-${idx}" class="filmstrip-thumb relative ${idx === 0 ? 'active' : ''}">
                        <img src="${thumbSrc}" alt="${isVideo ? 'YouTube Video Tour' : 'Property Photo'}" class="w-full h-full object-cover">
                        ${isVideo ? '<span class="absolute inset-0 flex items-center justify-center bg-slate-900/35"><i class="fa-brands fa-youtube text-rose-500 text-2xl drop-shadow"></i></span>' : ''}
                    </div>
                `;
            }).join('');
            selectMedia(0);

            // Specs Definition List
            const rows = [
                ['Plot Number', p.plotNumber || 'Upon Allotment'],
                ['Dimensions / Size', p.plotDimensions || (p.sqYards ? `${p.sqYards} Sq Yds` : `${p.size} ${p.sizeUnit || 'Marla'}`)],
                ['Street / Road', p.plotStreet || p.address || '—'],
                ['Sector / Block', p.plotSector || p.sector || p.area || '—'],
                ['Total Price', priceStr],
                ['Lump Sum', p.lumpSumPrice ? fmtPrice(p.lumpSumPrice) : '—'],
                ['Down Payment', p.downPaymentAmount ? fmtPrice(p.downPaymentAmount) : '20%'],
                ['Processing Fee', p.processingFee ? `PKR ${Number(p.processingFee).toLocaleString()}` : '—']
            ];
            document.getElementById('property-details-list').innerHTML = rows.map(([k, v]) => `
                <div class="flex justify-between py-2 border-b border-slate-100">
                    <span class="text-slate-500 font-medium">${k}</span>
                    <span class="font-bold text-slate-900 text-right">${v}</span>
                </div>
            `).join('');

            // Description
            document.getElementById('property-description').innerHTML = p.description || '';

            // Features
            const feats = (p.features && p.features.length) ? p.features : [];
            if (feats.length) {
                document.getElementById('features-wrap').classList.remove('hidden');
                document.getElementById('property-features').innerHTML = feats.map(f =>
                    `<span class="px-3 py-1 rounded-full bg-slate-100 text-slate-700 font-semibold">${f}</span>`
                ).join('');
            }

            // Coordinates + Render Pinned Plot Map immediately
            const coords = window.KaghanPlotMap ? window.KaghanPlotMap.getPlotCoords(p) : null;
            if (coords) {
                document.getElementById('plot-coords-label').innerText = `${coords[0].toFixed(5)}, ${coords[1].toFixed(5)}`;
            }
            if (window.KaghanPlotMap) {
                window.KaghanPlotMap.create('property-plot-map-root', {
                    mode: 'single',
                    property: p,
                    height: '440px'
                });
            }
        }

        function selectMedia(idx) {
            currentMediaIndex = idx;
            document.querySelectorAll('.filmstrip-thumb').forEach(el => el.classList.remove('active'));
            const t = document.getElementById(`thumb-${idx}`);
            if (t) t.classList.add('active');

            const item = currentMedia[idx];
            if (!item) return;

            const stage = document.getElementById('gallery-main-stage');
            const imgEl = document.getElementById('gallery-main-photo');
            const vidEl = document.getElementById('gallery-main-video');
            const countEl = document.getElementById('gallery-photo-count');

            if (item.type === 'video') {
                imgEl.classList.add('hidden');
                if (countEl) countEl.classList.add('hidden');
                vidEl.src = `https://www.youtube.com/embed/${item.videoId}?rel=0`;
                vidEl.classList.remove('hidden');
                if (stage) stage.classList.remove('cursor-pointer');
            } else {
                vidEl.src = '';
                vidEl.classList.add('hidden');
                imgEl.src = item.url;
                imgEl.classList.remove('hidden');
                if (countEl) countEl.classList.remove('hidden');
                if (stage) stage.classList.add('cursor-pointer');
            }
        }

        function handleMainStageClick() {
            const active = currentMedia[currentMediaIndex];
            if (!active || active.type !== 'image') return;
            const photoIdx = photoOnlyList.findIndex(m => m.url === active.url);
            openLightbox(photoIdx >= 0 ? photoIdx : 0);
        }

        function openLightbox(idx) {
            if (!photoOnlyList.length) return;
            currentLightboxPhotoIdx = idx;
            document.getElementById('gallery-lightbox-modal').classList.add('active');
            document.getElementById('lightbox-img').src = photoOnlyList[idx].url;
        }
        function closeLightbox() { document.getElementById('gallery-lightbox-modal').classList.remove('active'); }
        function changeLightboxPhoto(dir) {
            if (!photoOnlyList.length) return;
            currentLightboxPhotoIdx = (currentLightboxPhotoIdx + dir + photoOnlyList.length) % photoOnlyList.length;
            document.getElementById('lightbox-img').src = photoOnlyList[currentLightboxPhotoIdx].url;
        }
        function shareListing() {
            if (navigator.share) navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
            else if (navigator.clipboard) navigator.clipboard.writeText(window.location.href).then(() => alert('Link copied!'));
        }

        async function handleLeadSubmit(e) {
            e.preventDefault();
            const fb = document.getElementById('lead-feedback');
            try {
                if (window.KaghanDB && window.KaghanDB.createLead) {
                    await window.KaghanDB.createLead({
                        name: document.getElementById('lead-name').value.trim(),
                        phone: document.getElementById('lead-phone').value.trim(),
                        propertyId: currentProperty ? currentProperty.id : '',
                        propertyTitle: currentProperty ? currentProperty.title : 'Listing',
                        message: document.getElementById('lead-message').value.trim(),
                        sourcePage: window.location.href,
                        status: 'new'
                    });
                }
                fb.className = 'text-center text-xs font-bold p-2 rounded-lg bg-emerald-50 text-emerald-700 block';
                fb.innerText = 'Inquiry sent! We will contact you shortly.';
                e.target.reset();
            } catch (err) {
                fb.className = 'text-center text-xs font-bold p-2 rounded-lg bg-rose-50 text-rose-700 block';
                fb.innerText = 'Error sending. Please call +92 334 0091127.';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug') || params.get('id');

            if (slug && window.KaghanDB && window.KaghanDB.getPropertyBySlugOrId) {
                currentProperty = await window.KaghanDB.getPropertyBySlugOrId(slug);
            }
            if (!currentProperty && window.KaghanDB && window.KaghanDB.getProperties) {
                const all = await window.KaghanDB.getProperties();
                if (slug) {
                    const norm = slug.toLowerCase().trim();
                    currentProperty = all.find(p => (p.slug || '').toLowerCase() === norm || String(p.id || '').toLowerCase() === norm);
                }
                if (!currentProperty && all.length > 0) currentProperty = all[0];
            }

            if (currentProperty) {
                if (currentProperty.isNewProject) {
                    window.location.replace(`project-detail.html?slug=${encodeURIComponent(currentProperty.slug || currentProperty.id)}`);
                    return;
                }
                populateUI(currentProperty);
            } else {
                document.querySelector('main').innerHTML = `
                    <div class="bg-white p-12 text-center rounded-2xl border border-slate-200 max-w-md mx-auto my-12 space-y-3">
                        <h2 class="text-lg font-bold outfit">Listing Not Found</h2>
                        <a href="projects.html" class="inline-block bg-emerald-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl">View All Listings</a>
                    </div>`;
            }

            window.addEventListener('marketStateChanged', () => {
                if (currentProperty) populateUI(currentProperty);
            });
        });
    </script>
</body>
</html>
