<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Plot Details | Kaghan Properties</title>
    <meta id="page-meta-desc" name="description" content="Verified plot specs, pinned location on interactive CAD & satellite map, and direct contact.">
    <meta name="theme-color" content="#077943">
    <link rel="canonical" href="https://kaghanproperties.com/property.html">

    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/shared.js"></script>
    <script src="assets/js/plot-map.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="site-header"></div>

    <main class="market-container py-6 flex-1 space-y-6">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-1.5 text-xs text-slate-400 font-medium">
            <a href="index.html" class="hover:text-emerald-700">Home</a>
            <i class="fa-solid fa-chevron-right text-[8px]"></i>
            <a href="projects.html" class="hover:text-emerald-700">Listings</a>
            <i class="fa-solid fa-chevron-right text-[8px]"></i>
            <span id="crumb-society" class="text-slate-700 font-semibold">DHA Margalla Enclave</span>
        </nav>

        <!-- Title Row -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1">
                <div class="flex items-center gap-2 flex-wrap">
                    <span id="detail-plot-pill" class="hidden bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full inline-flex items-center gap-1"></span>
                    <span id="detail-cat-pill" class="bg-slate-100 text-slate-700 text-[11px] font-bold px-2.5 py-0.5 rounded-full">Verified</span>
                </div>
                <h1 id="detail-h1" class="text-2xl sm:text-3xl font-extrabold outfit text-slate-900">Loading listing...</h1>
                <p id="detail-address" class="text-xs text-slate-500 font-medium flex items-center gap-1.5"></p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <a href="#plot-map-section" class="px-3.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-map-pin"></i> Plot Map
                </a>
                <button onclick="shareListing()" title="Share" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- Left 8 Cols -->
            <div class="lg:col-span-8 space-y-6">
                <!-- Gallery -->
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200 space-y-3">
                    <div class="relative h-[300px] sm:h-[420px] rounded-xl overflow-hidden cursor-pointer bg-slate-100" onclick="openLightbox(currentPhotoIndex)">
                        <img id="gallery-main-photo" src="assets/images/dha-margalla-hero.jpg" alt="Property Photo" class="w-full h-full object-cover">
                        <span id="gallery-photo-count" class="absolute bottom-3 left-3 bg-slate-900/80 text-white text-xs font-bold px-3 py-1 rounded-lg">1 Photo</span>
                    </div>
                    <div id="gallery-filmstrip" class="filmstrip-container"></div>
                </div>

                <!-- Key Specs Strip -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center text-xs">
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                        <span class="text-slate-400 text-[10px] font-bold uppercase block">Plot / Unit</span>
                        <span id="spec-plot" class="font-extrabold outfit text-sm text-emerald-700">—</span>
                    </div>
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                        <span class="text-slate-400 text-[10px] font-bold uppercase block">Size</span>
                        <span id="spec-size" class="font-extrabold outfit text-sm text-slate-900">—</span>
                    </div>
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                        <span class="text-slate-400 text-[10px] font-bold uppercase block">Down Payment</span>
                        <span id="spec-dp" class="font-extrabold outfit text-sm text-slate-900">—</span>
                    </div>
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                        <span class="text-slate-400 text-[10px] font-bold uppercase block">Quarterly</span>
                        <span id="spec-qtr" class="font-extrabold outfit text-sm text-slate-900">—</span>
                    </div>
                </div>

                <!-- PINNED PLOT MAP & LIVE EMAP (VISIBLE DIRECTLY ON PAGE) -->
                <section id="plot-map-section" class="space-y-2.5 scroll-mt-24">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-extrabold outfit text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-map-pin text-emerald-600"></i> Pinned Plot Location &amp; Emap
                        </h2>
                        <span id="plot-coords-label" class="text-[11px] font-mono text-slate-400"></span>
                    </div>
                    <div id="property-plot-map-root"></div>
                </section>

                <!-- Clean Details & Description -->
                <section class="bg-white p-5 rounded-2xl border border-slate-200 space-y-5">
                    <div>
                        <h2 class="text-base font-extrabold outfit text-slate-900 border-b border-slate-100 pb-2 mb-3">Specifications</h2>
                        <div id="property-details-list" class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-2 text-xs"></div>
                    </div>

                    <div>
                        <h2 class="text-base font-extrabold outfit text-slate-900 border-b border-slate-100 pb-2 mb-2">Overview</h2>
                        <div id="property-description" class="text-xs sm:text-sm leading-relaxed text-slate-600 space-y-2"></div>
                    </div>

                    <div id="features-wrap" class="hidden">
                        <h2 class="text-base font-extrabold outfit text-slate-900 border-b border-slate-100 pb-2 mb-3">Highlights</h2>
                        <div id="property-features" class="flex flex-wrap gap-2 text-xs"></div>
                    </div>
                </section>
            </div>

            <!-- Right 4 Cols: Compact Sticky Contact Card -->
            <aside class="lg:col-span-4 lg:sticky lg:top-[84px]">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div class="border-b border-slate-100 pb-4">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Price</span>
                        <div id="rail-price" class="text-3xl font-extrabold outfit text-emerald-800">PKR —</div>
                        <div id="rail-lumpsum" class="text-xs text-slate-500 font-medium mt-0.5"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <a id="rail-call-btn" href="tel:+923340091127" class="py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-phone"></i> Call
                        </a>
                        <a id="rail-wa-btn" href="https://wa.me/923340091127" target="_blank" rel="noopener" class="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                        </a>
                    </div>

                    <form onsubmit="handleLeadSubmit(event)" class="pt-3 border-t border-slate-100 space-y-2.5 text-xs">
                        <div class="font-bold text-slate-800">Request Details</div>
                        <input type="text" id="lead-name" required placeholder="Your Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-600">
                        <input type="tel" id="lead-phone" required placeholder="Phone / WhatsApp" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-600">
                        <textarea id="lead-message" rows="2" placeholder="Message" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-emerald-600"></textarea>
                        <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold transition-colors">
                            Send Inquiry
                        </button>
                        <div id="lead-feedback" class="hidden text-center text-xs font-bold p-2 rounded-lg"></div>
                    </form>
                </div>
            </aside>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="gallery-lightbox-modal" class="lightbox-modal" onclick="if(event.target === this) closeLightbox()">
        <div class="relative max-w-5xl w-full p-4 flex flex-col items-center">
            <button onclick="closeLightbox()" class="absolute -top-10 right-2 text-white hover:text-rose-400 text-2xl"><i class="fa-solid fa-xmark"></i></button>
            <div class="relative w-full h-[65vh] flex items-center justify-center">
                <img id="lightbox-img" src="" alt="" class="max-h-full max-w-full object-contain rounded-xl shadow-2xl">
                <button onclick="changeLightboxPhoto(-1)" class="absolute left-2 w-10 h-10 rounded-full bg-slate-900/80 text-white hover:bg-emerald-600"><i class="fa-solid fa-chevron-left"></i></button>
                <button onclick="changeLightboxPhoto(1)" class="absolute right-2 w-10 h-10 rounded-full bg-slate-900/80 text-white hover:bg-emerald-600"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Mobile Sticky Bottom CTA -->
    <div class="mobile-sticky-cta md:hidden">
        <div>
            <span class="text-[10px] text-slate-400 font-bold uppercase block">Price</span>
            <span id="mobile-cta-price" class="text-emerald-800 font-extrabold text-sm outfit">—</span>
        </div>
        <div class="flex items-center gap-2">
            <a id="mobile-cta-call" href="tel:+923340091127" class="btn-primary text-xs py-2 px-3.5 rounded-xl font-bold">Call</a>
            <a id="mobile-cta-wa" href="https://wa.me/923340091127" target="_blank" class="btn-whatsapp text-xs py-2 px-3.5 rounded-xl font-bold">WhatsApp</a>
        </div>
    </div>

    <div id="site-footer"></div>

    <script>
        let currentProperty = null;
        let currentPhotos = [];
        let currentPhotoIndex = 0;

        function fmtPrice(val) {
            return window.KaghanSharedUI ? window.KaghanSharedUI.formatPrice(val) : ('PKR ' + Number(val || 0).toLocaleString());
        }

        function populateUI(p) {
            document.title = `${p.title} | Kaghan Properties`;
            document.getElementById('detail-h1').innerText = p.title;
            document.getElementById('crumb-society').innerText = p.area || 'DHA Margalla Enclave';
            document.getElementById('detail-address').innerHTML = `<i class="fa-solid fa-location-dot text-emerald-600"></i> ${[p.plotStreet, p.plotSector || p.sector, p.area, p.city].filter(Boolean).join(', ')}`;

            const plotPill = document.getElementById('detail-plot-pill');
            if (p.plotNumber) {
                plotPill.innerHTML = `<i class="fa-solid fa-map-pin text-[10px]"></i> ${p.plotNumber}`;
                plotPill.classList.remove('hidden');
            }
            document.getElementById('detail-cat-pill').innerText = p.category || p.type || 'Plot';

            // Prices & Specs
            const priceStr = fmtPrice(p.price);
            document.getElementById('rail-price').innerText = priceStr;
            document.getElementById('mobile-cta-price').innerText = priceStr;
            if (p.lumpSumPrice) {
                document.getElementById('rail-lumpsum').innerText = `Lump Sum: ${fmtPrice(p.lumpSumPrice)}`;
            }

            document.getElementById('spec-plot').innerText = p.plotNumber || 'Allotted';
            document.getElementById('spec-size').innerText = p.plotDimensions || (p.sqYards ? `${p.sqYards} Sq Yds` : `${p.size || ''} ${p.sizeUnit || 'Marla'}`);
            document.getElementById('spec-dp').innerText = p.downPaymentAmount ? fmtPrice(p.downPaymentAmount) : (p.installments?.advance ? fmtPrice(p.installments.advance) : '20% Down');
            document.getElementById('spec-qtr').innerText = p.quarterlyAmount ? fmtPrice(p.quarterlyAmount) : (p.installments?.monthly ? fmtPrice(p.installments.monthly) : 'Quarterly');

            // Contacts
            const phone = p.agentPhone || '+923340091127';
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const waMsg = encodeURIComponent(`Hi, I am interested in ${p.title}${p.plotNumber ? ' (' + p.plotNumber + ')' : ''} — ${priceStr}.`);
            const waHref = `https://wa.me/${cleanPhone}?text=${waMsg}`;
            ['rail-call-btn', 'mobile-cta-call'].forEach(id => { const el = document.getElementById(id); if (el) el.href = `tel:${phone}`; });
            ['rail-wa-btn', 'mobile-cta-wa'].forEach(id => { const el = document.getElementById(id); if (el) el.href = waHref; });
            document.getElementById('lead-message').value = `I'm interested in ${p.title}${p.plotNumber ? ' (' + p.plotNumber + ')' : ''}.`;

            // Gallery
            currentPhotos = (p.images && p.images.length > 0) ? p.images : [{ url: 'assets/images/dha-margalla-hero.jpg' }];
            document.getElementById('gallery-photo-count').innerText = `${currentPhotos.length} Photo${currentPhotos.length > 1 ? 's' : ''}`;
            document.getElementById('gallery-filmstrip').innerHTML = currentPhotos.map((ph, idx) =>
                `<div onclick="selectPhoto(${idx})" id="thumb-${idx}" class="filmstrip-thumb ${idx === 0 ? 'active' : ''}"><img src="${ph.url || ph}" alt="" class="w-full h-full object-cover"></div>`
            ).join('');
            selectPhoto(0);

            // Specs Definition List
            const rows = [
                ['Plot Number', p.plotNumber || 'Upon Allotment'],
                ['Dimensions / Size', p.plotDimensions || (p.sqYards ? `${p.sqYards} Sq Yds` : `${p.size} ${p.sizeUnit || 'Marla'}`)],
                ['Street / Road', p.plotStreet || p.address || '—'],
                ['Sector / Block', p.plotSector || p.sector || p.area || '—'],
                ['Total Price', priceStr],
                ['Lump Sum', p.lumpSumPrice ? fmtPrice(p.lumpSumPrice) : '—'],
                ['Down Payment', p.downPaymentAmount ? fmtPrice(p.downPaymentAmount) : '20%'],
                ['Processing Fee', p.processingFee ? `PKR ${Number(p.processingFee).toLocaleString()}` : '—']
            ];
            document.getElementById('property-details-list').innerHTML = rows.map(([k, v]) => `
                <div class="flex justify-between py-2 border-b border-slate-100">
                    <span class="text-slate-500 font-medium">${k}</span>
                    <span class="font-bold text-slate-900 text-right">${v}</span>
                </div>
            `).join('');

            // Description
            document.getElementById('property-description').innerHTML = p.description || '';

            // Features
            const feats = (p.features && p.features.length) ? p.features : [];
            if (feats.length) {
                document.getElementById('features-wrap').classList.remove('hidden');
                document.getElementById('property-features').innerHTML = feats.map(f =>
                    `<span class="px-3 py-1 rounded-full bg-slate-100 text-slate-700 font-semibold">${f}</span>`
                ).join('');
            }

            // Coordinates + Render Pinned Plot Map immediately
            const coords = window.KaghanPlotMap ? window.KaghanPlotMap.getPlotCoords(p) : null;
            if (coords) {
                document.getElementById('plot-coords-label').innerText = `${coords[0].toFixed(5)}, ${coords[1].toFixed(5)}`;
            }
            if (window.KaghanPlotMap) {
                window.KaghanPlotMap.create('property-plot-map-root', {
                    mode: 'single',
                    property: p,
                    height: '440px'
                });
            }
        }

        function selectPhoto(idx) {
            currentPhotoIndex = idx;
            document.querySelectorAll('.filmstrip-thumb').forEach(el => el.classList.remove('active'));
            const t = document.getElementById(`thumb-${idx}`);
            if (t) t.classList.add('active');
            const img = document.getElementById('gallery-main-photo');
            if (img && currentPhotos[idx]) img.src = currentPhotos[idx].url || currentPhotos[idx];
        }

        function openLightbox(idx) {
            currentPhotoIndex = idx;
            document.getElementById('gallery-lightbox-modal').classList.add('active');
            document.getElementById('lightbox-img').src = currentPhotos[idx].url || currentPhotos[idx];
        }
        function closeLightbox() { document.getElementById('gallery-lightbox-modal').classList.remove('active'); }
        function changeLightboxPhoto(dir) {
            currentPhotoIndex = (currentPhotoIndex + dir + currentPhotos.length) % currentPhotos.length;
            document.getElementById('lightbox-img').src = currentPhotos[currentPhotoIndex].url || currentPhotos[currentPhotoIndex];
        }
        function shareListing() {
            if (navigator.share) navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
            else if (navigator.clipboard) navigator.clipboard.writeText(window.location.href).then(() => alert('Link copied!'));
        }

        async function handleLeadSubmit(e) {
            e.preventDefault();
            const fb = document.getElementById('lead-feedback');
            try {
                if (window.KaghanDB && window.KaghanDB.createLead) {
                    await window.KaghanDB.createLead({
                        name: document.getElementById('lead-name').value.trim(),
                        phone: document.getElementById('lead-phone').value.trim(),
                        propertyId: currentProperty ? currentProperty.id : '',
                        propertyTitle: currentProperty ? currentProperty.title : 'Listing',
                        message: document.getElementById('lead-message').value.trim(),
                        sourcePage: window.location.href,
                        status: 'new'
                    });
                }
                fb.className = 'text-center text-xs font-bold p-2 rounded-lg bg-emerald-50 text-emerald-700 block';
                fb.innerText = 'Inquiry sent! We will contact you shortly.';
                e.target.reset();
            } catch (err) {
                fb.className = 'text-center text-xs font-bold p-2 rounded-lg bg-rose-50 text-rose-700 block';
                fb.innerText = 'Error sending. Please call +92 334 0091127.';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug') || params.get('id');

            if (slug && window.KaghanDB && window.KaghanDB.getPropertyBySlugOrId) {
                currentProperty = await window.KaghanDB.getPropertyBySlugOrId(slug);
            }
            if (!currentProperty && window.KaghanDB && window.KaghanDB.getProperties) {
                const all = await window.KaghanDB.getProperties();
                if (slug) {
                    const norm = slug.toLowerCase().trim();
                    currentProperty = all.find(p => (p.slug || '').toLowerCase() === norm || String(p.id || '').toLowerCase() === norm);
                }
                if (!currentProperty && all.length > 0) currentProperty = all[0];
            }

            if (currentProperty) {
                if (currentProperty.isNewProject) {
                    window.location.replace(`project-detail.html?slug=${encodeURIComponent(currentProperty.slug || currentProperty.id)}`);
                    return;
                }
                populateUI(currentProperty);
            } else {
                document.querySelector('main').innerHTML = `
                    <div class="bg-white p-12 text-center rounded-2xl border border-slate-200 max-w-md mx-auto my-12 space-y-3">
                        <h2 class="text-lg font-bold outfit">Listing Not Found</h2>
                        <a href="projects.html" class="inline-block bg-emerald-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl">View All Listings</a>
                    </div>`;
            }

            window.addEventListener('marketStateChanged', () => {
                if (currentProperty) populateUI(currentProperty);
            });
        });
    </script>
</body>
</html>
