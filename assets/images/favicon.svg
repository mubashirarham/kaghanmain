<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#7B5B05"/>
    </linearGradient>
    <linearGradient id="goldGradSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#E6CA65"/>
      <stop offset="100%" stop-color="#FFF8DC"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Subtle Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Architectural Peak & Crown Motif -->
  <g filter="url(#goldGlow)">
    <!-- Mountain / Apex Roofline Crest -->
    <path d="M256 96 L356 220 H304 L256 160 L208 220 H156 Z" fill="url(#goldGrad)" />
    
    <!-- Central Tower / Diamond Accent -->
    <polygon points="256,120 268,144 256,160 244,144" fill="#FFF9E6"/>

    <!-- Bold Stylized Monogram "K" -->
    <path d="M168 228 H204 V396 H168 Z" fill="url(#goldGrad)"/>
    <path d="M204 308 L286 228 H338 L244 322 L344 396 H290 L204 330 Z" fill="url(#goldGradSoft)"/>

    <!-- Bottom Architectural Baseline / Horizon Bar -->
    <rect x="156" y="416" width="200" height="8" rx="4" fill="url(#goldGrad)"/>
    <!-- Subtle Secondary Accent Dot -->
    <circle cx="256" cy="442" r="5" fill="url(#goldGrad)"/>
  </g>
</svg>
