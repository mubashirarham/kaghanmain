<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights &amp; Articles | Kaghan Properties</title>
    <meta name="description" content="Real estate insights, project updates, and investment guides.">
    <meta name="theme-color" content="#077943">
    <link rel="canonical" href="https://kaghanproperties.com/blog.html">

    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/shared.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="site-header"></div>

    <main class="market-container py-10 flex-1 space-y-8">
        <div id="blog-list-view" class="space-y-6">
            <div class="pb-4 border-b-2 border-slate-300 flex flex-wrap items-end justify-between gap-4">
                <div>
                    <span class="text-[11px] font-extrabold uppercase tracking-widest text-emerald-700">Knowledge Hub</span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold outfit text-slate-900 mt-0.5">Market Insights &amp; Articles</h1>
                </div>
                <div id="blog-cat-bar" class="flex flex-wrap gap-2 text-xs"></div>
            </div>

            <div id="blog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full py-12 text-center text-slate-400 text-xs">
                    <i class="fa-solid fa-circle-notch fa-spin text-emerald-600 text-lg mr-2"></i> Loading articles from Firestore...
                </div>
            </div>
        </div>

        <article id="blog-reader-view" class="hidden max-w-4xl mx-auto bg-white border-2 border-slate-300 rounded-3xl shadow-sm p-6 sm:p-10 space-y-6">
            <div class="flex items-center justify-between gap-4 border-b-2 border-slate-200 pb-4">
                <button onclick="closeReader()" class="px-3.5 py-2 rounded-xl bg-slate-100 border-2 border-slate-300 hover:border-emerald-600 text-xs font-bold text-slate-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back to Articles
                </button>
                <span id="read-cat" class="px-3 py-1 rounded-full bg-emerald-50 border border-emerald-300 text-emerald-800 text-[11px] font-bold"></span>
            </div>

            <div class="space-y-2">
                <h2 id="read-title" class="text-2xl sm:text-4xl font-extrabold outfit text-slate-900 leading-tight"></h2>
                <div class="flex items-center gap-3 text-xs text-slate-500 font-semibold">
                    <span id="read-author"></span>
                    <span>&bull;</span>
                    <span id="read-date"></span>
                </div>
            </div>

            <div id="read-image-wrap" class="hidden h-64 sm:h-96 rounded-2xl overflow-hidden border-2 border-slate-200">
                <img id="read-image" src="" alt="" class="w-full h-full object-cover">
            </div>

            <div id="read-content" class="text-sm text-slate-700 leading-relaxed space-y-4"></div>
        </article>
    </main>

    <div id="site-footer"></div>

    <script>
        let allBlogs = [];
        let activeCategory = 'all';

        function escHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        function renderCategoryButtons() {
            const bar = document.getElementById('blog-cat-bar');
            const cats = [...new Set(allBlogs.map(b => b.category).filter(Boolean))];
            bar.innerHTML = ['all', ...cats].map(cat => `
                <button onclick="filterCategory('${escHtml(cat)}')" class="px-3.5 py-1.5 rounded-xl font-bold ${activeCategory === cat ? 'bg-slate-900 border-2 border-slate-900 text-white' : 'bg-white border-2 border-slate-300 text-slate-700 hover:border-emerald-600'}">
                    ${cat === 'all' ? 'All' : escHtml(cat)}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCategoryButtons();
            renderBlogs();
        }

        function renderBlogs() {
            const grid = document.getElementById('blog-grid');
            const list = activeCategory === 'all' ? allBlogs : allBlogs.filter(b => b.category === activeCategory);
            if (!list.length) {
                grid.innerHTML = `<div class="col-span-full bg-white p-12 rounded-2xl border-2 border-slate-300 text-center text-slate-500 text-xs">No published articles in Firestore yet.</div>`;
                return;
            }
            grid.innerHTML = list.map(b => {
                const img = b.coverImage || b.imageUrl || '';
                const authorName = typeof b.author === 'object' ? (b.author.name || '') : (b.author || '');
                return `
                    <article class="kp-card rounded-2xl overflow-hidden flex flex-col">
                        <a href="#${encodeURIComponent(b.slug || b.id)}" class="h-48 bg-slate-100 border-b-2 border-slate-200 flex items-center justify-center overflow-hidden relative">
                            ${img ? `<img src="${escHtml(img)}" alt="${escHtml(b.title)}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-newspaper text-3xl text-slate-300"></i>`}
                            ${b.category ? `<span class="absolute top-3 left-3 bg-slate-900 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">${escHtml(b.category)}</span>` : ''}
                        </a>
                        <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <h2 class="font-extrabold outfit text-base text-slate-900 leading-snug"><a href="#${encodeURIComponent(b.slug || b.id)}" class="hover:text-emerald-700">${escHtml(b.title)}</a></h2>
                                <p class="text-xs text-slate-500 mt-1.5 line-clamp-3">${escHtml(b.excerpt || '')}</p>
                            </div>
                            <div class="pt-3 border-t border-slate-200 flex items-center justify-between text-[11px] font-bold text-slate-500">
                                <span>${escHtml(authorName)}</span>
                                <a href="#${encodeURIComponent(b.slug || b.id)}" class="text-emerald-700 hover:underline">Read &rarr;</a>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function openReader(slug) {
            const norm = decodeURIComponent(slug || '');
            const b = allBlogs.find(x => x.slug === norm || x.id === norm);
            if (!b) return closeReader();
            document.getElementById('blog-list-view').classList.add('hidden');
            document.getElementById('blog-reader-view').classList.remove('hidden');
            document.getElementById('read-title').innerText = b.title || '';
            document.getElementById('read-cat').innerText = b.category || 'Article';
            const authorName = typeof b.author === 'object' ? (b.author.name || '') : (b.author || '');
            document.getElementById('read-author').innerText = authorName;
            document.getElementById('read-date').innerText = b.createdAt ? new Date(b.createdAt).toLocaleDateString() : '';
            const img = b.coverImage || b.imageUrl || '';
            const wrap = document.getElementById('read-image-wrap');
            if (img) {
                document.getElementById('read-image').src = img;
                wrap.classList.remove('hidden');
            } else {
                wrap.classList.add('hidden');
            }
            document.getElementById('read-content').innerHTML = b.content || '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeReader() {
            if (window.location.hash) history.replaceState(null, '', window.location.pathname);
            document.getElementById('blog-reader-view').classList.add('hidden');
            document.getElementById('blog-list-view').classList.remove('hidden');
        }

        function checkHash() {
            const h = window.location.hash.replace(/^#/, '');
            if (h) openReader(h);
            else { closeReader(); renderBlogs(); }
        }

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', async () => {
            allBlogs = await window.KaghanDB.getBlogPosts('published');
            renderCategoryButtons();
            checkHash();
        });
    </script>
</body>
</html>
