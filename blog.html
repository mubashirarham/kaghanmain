    <meta property="og:url" content="https://kaghanproperties.com/blog.html">

    <!-- Structured Data (JSON-LD Blog & BreadcrumbList Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Blog",
          "@id": "https://kaghanproperties.com/blog.html#blog",
          "url": "https://kaghanproperties.com/blog.html",
          "name": "Kaghan Properties Real Estate & Tech Insights",
          "description": "Market intelligence, construction guides, and economic analyses by Tanzil Minhas.",
          "publisher": {
            "@type": "RealEstateAgent",
            "name": "Kaghan Properties",
            "url": "https://kaghanproperties.com/"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://kaghanproperties.com/index.html"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Blog & Insights",
              "item": "https://kaghanproperties.com/blog.html"
            }
          ]
        }
      ]
    }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .outfit {
            font-family: 'Outfit', sans-serif;
        }
        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Global Dynamic Site Header -->
    <div id="site-header"></div>

    <!-- Header Section -->
    <header class="pt-12 sm:pt-20 md:pt-24 pb-12 sm:pb-16 bg-slate-900 text-white relative overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-gold/10 via-transparent to-transparent opacity-40"></div>
        <div class="max-w-5xl mx-auto px-4 sm:px-6 relative z-10 text-center">
            <span class="text-gold font-bold uppercase tracking-[0.2em] sm:tracking-[0.3em] text-xs mb-3 sm:mb-4 block">Knowledge Hub</span>
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold mb-4 sm:mb-6 outfit leading-tight">Insights & <span class="text-gold">Market Intelligence</span></h1>
            <p class="text-slate-400 text-xs sm:text-sm md:text-base max-w-xl mx-auto font-light leading-relaxed">Expert analysis on real estate entrepreneurship, 10-year roadmaps, construction realities, and yield-driven investments in Pakistan.</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 md:px-8 py-8 sm:py-16">
        
        <!-- View 1: Blog Grid List -->
        <div id="blog-list-view" class="space-y-8 sm:space-y-12">
            
            <!-- Category Filter Row -->
            <div class="flex gap-2 sm:gap-3 overflow-x-auto no-scrollbar pb-2 sm:pb-4 justify-start md:justify-center border-b border-slate-200/60">
                <button onclick="filterCategory('all')" id="cat-btn-all" class="px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-xs font-bold bg-slate-900 text-white shadow-md transition-all whitespace-nowrap">All Insights</button>
                <button onclick="filterCategory('Market Shifts')" id="cat-btn-Market Shifts" class="px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-xs font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition-all whitespace-nowrap">Market Shifts</button>
                <button onclick="filterCategory('Tech & AI')" id="cat-btn-Tech & AI" class="px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-xs font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition-all whitespace-nowrap">Tech & AI</button>
                <button onclick="filterCategory('Construction')" id="cat-btn-Construction" class="px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-xs font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition-all whitespace-nowrap">Construction Costs</button>
                <button onclick="filterCategory('Expat Investing')" id="cat-btn-Expat Investing" class="px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-xs font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition-all whitespace-nowrap">Expat Investing</button>
            </div>

            <!-- Blog Grid -->
            <div id="blog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                <!-- Dynamically loaded blog items -->
                <div class="col-span-1 sm:col-span-2 lg:col-span-3 text-center text-slate-400 py-12">
                    <i class="fa-solid fa-spinner animate-spin text-2xl text-gold mb-3"></i>
                    <p class="text-xs uppercase font-semibold tracking-wider">Syncing article catalog...</p>
                </div>
            </div>
        </div>

        <!-- View 2: Full Article Reader (Hidden by default) -->
        <div id="blog-reader-view" class="hidden max-w-4xl mx-auto bg-white border border-slate-100 rounded-2xl sm:rounded-[3rem] shadow-xl overflow-hidden p-5 sm:p-8 md:p-12 relative">
            <button onclick="closeReader()" class="absolute top-4 sm:top-6 right-4 sm:right-6 text-slate-400 hover:text-slate-900 transition-colors text-lg w-9 h-9 sm:w-10 sm:h-10 bg-slate-100 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-arrow-left text-xs sm:text-sm"></i>
            </button>

            <!-- Metadata -->
            <div class="space-y-3 sm:space-y-4 mb-6 sm:mb-8 pr-12">
                <span id="read-cat" class="bg-gold/10 text-gold border border-gold/25 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider inline-block">Category</span>
                <h2 id="read-title" class="text-2xl sm:text-3xl md:text-5xl font-extrabold outfit text-slate-900 leading-tight">Article Title</h2>
                <div class="flex items-center gap-3 sm:gap-4 text-xs text-slate-400 font-semibold pt-1">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-user text-[#D4AF37]"></i> <span id="read-author">Author</span></span>
                    <span class="h-3 w-px bg-slate-200"></span>
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-calendar text-[#D4AF37]"></i> <span id="read-date">Date</span></span>
                </div>
            </div>

            <!-- Featured Image -->
            <div class="h-56 sm:h-[350px] md:h-[450px] rounded-xl sm:rounded-3xl overflow-hidden mb-6 sm:mb-8 border border-slate-100">
                <img id="read-image" src="" alt="Featured Art" class="w-full h-full object-cover">
            </div>

            <!-- Main Rich text Content -->
            <article id="read-content" class="text-slate-700 text-xs sm:text-sm leading-relaxed space-y-4 sm:space-y-6 prose max-w-none">
                <!-- Loaded dynamically -->
            </article>
        </div>

    </main>

    <!-- Global Dynamic Site Footer -->
    <div id="site-footer"></div>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- DB shared script -->
    <script src="assets/js/db.js"></script>
    <script src="assets/js/script.js"></script>

    <!-- Blog Controller Logic -->
    <script>
        let allBlogs = [];
        let filteredBlogs = [];
        let activeCategory = 'all';

        async function initBlog() {
            try {
                allBlogs = (await CorporateDB.getBlogs()) || [];
                checkHashRoute();
            } catch(e) {
                console.error("Fail to load blog engine:", e);
                document.getElementById('blog-grid').innerHTML = `<div class="col-span-3 text-center text-rose-500 py-12">Failed to load articles from database.</div>`;
            }
        }

        // Render articles list
        function renderBlogs() {
            const grid = document.getElementById('blog-grid');
            filteredBlogs = allBlogs.filter(b => activeCategory === 'all' || b.category === activeCategory);

            if (filteredBlogs.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center text-slate-500 py-12">No insights published under this category yet.</div>`;
                return;
            }

            grid.innerHTML = filteredBlogs.map(b => {
                const img = b.imageUrl || 'assets/images/logo.png';
                return `
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm hover-lift hover:border-[#D4AF37] transition-all flex flex-col justify-between">
                        <div class="h-56 overflow-hidden relative">
                            <img src="${img}" alt="${b.title}" class="w-full h-full object-cover" onerror="this.src='stay/assets/images/logo.png'">
                            <span class="absolute top-4 left-4 bg-slate-900 text-white text-[9px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">${b.category}</span>
                        </div>
                        <div class="p-8 flex-grow flex flex-col justify-between">
                            <div>
                                <h4 class="text-lg font-bold outfit text-slate-900 mb-3 leading-snug">${b.title}</h4>
                                <p class="text-slate-500 text-xs leading-relaxed mb-6">${b.excerpt}</p>
                            </div>
                            <div class="pt-4 border-t border-slate-50 flex justify-between items-center text-[10px] font-semibold text-slate-400">
                                <span>BY ${b.author.toUpperCase()}</span>
                                <a href="#${b.slug}" class="text-[#D4AF37] font-bold uppercase tracking-wider hover:underline flex items-center gap-1.5">Read Post <i class="fa-solid fa-arrow-right text-[8px]"></i></a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter Category
        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('main button[id^="cat-btn-"]').forEach(btn => {
                btn.className = 'px-5 py-2.5 rounded-full text-xs font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 transition-all whitespace-nowrap';
            });
            document.getElementById(`cat-btn-${cat}`).className = 'px-5 py-2.5 rounded-full text-xs font-bold bg-slate-900 text-white shadow-md transition-all whitespace-nowrap';
            renderBlogs();
        }

        // Show Single Article Reader
        function openReader(slug) {
            const article = allBlogs.find(b => b.slug === slug);
            if (!article) {
                closeReader();
                return;
            }

            document.getElementById('blog-list-view').classList.add('hidden');
            const reader = document.getElementById('blog-reader-view');
            reader.classList.remove('hidden');

            document.getElementById('read-title').innerText = article.title;
            document.getElementById('read-cat').innerText = article.category;
            document.getElementById('read-author').innerText = article.author;
            document.getElementById('read-date').innerText = new Date(article.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('read-image').src = article.imageUrl || 'assets/images/logo.png';
            document.getElementById('read-image').onerror = function() { this.src = 'stay/assets/images/logo.png'; };
            document.getElementById('read-content').innerHTML = article.content;

            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        function closeReader() {
            window.location.hash = '';
            document.getElementById('blog-reader-view').classList.add('hidden');
            document.getElementById('blog-list-view').classList.remove('hidden');
        }

        // Hash Routing
        function checkHashRoute() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                openReader(hash);
            } else {
                closeReader();
                renderBlogs();
            }
        }

        window.addEventListener('hashchange', checkHashRoute);
        window.addEventListener('load', initBlog);
    </script>
    <script src="assets/js/shared.js"></script>
</body>
</html>
