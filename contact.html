<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Kaghan Properties</title>
    <meta name="description" content="Get in touch with our real estate advisory team for plot inquiries, site visits, and consultations.">
    <meta name="theme-color" content="#077943">
    <link rel="canonical" href="https://kaghanproperties.com/contact.html">

    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/shared.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="site-header"></div>

    <main class="market-container py-12 flex-1 space-y-10">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <!-- Contact Form -->
            <div class="lg:col-span-7 bg-white p-6 sm:p-8 rounded-3xl border-2 border-slate-300 shadow-sm space-y-5">
                <div class="border-b-2 border-slate-200 pb-3">
                    <span class="text-[11px] font-extrabold uppercase tracking-widest text-emerald-700">Direct Inquiry</span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold outfit text-slate-900 mt-0.5">Send Us a Message</h1>
                </div>

                <form id="contact-form" class="space-y-4 text-xs">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Full Name *</label>
                            <input type="text" id="contact-name" required placeholder="Your Name" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Phone / WhatsApp *</label>
                            <input type="tel" id="contact-phone" required placeholder="Phone Number" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Email Address</label>
                        <input type="email" id="contact-email" placeholder="you@example.com" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Project / Inquiry Topic</label>
                        <select id="contact-type" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-3.5 py-2.5 font-semibold text-slate-800 focus:outline-none focus:border-emerald-600">
                            <option value="General Inquiry">General Inquiry</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Message *</label>
                        <textarea id="contact-message" rows="4" required placeholder="Tell us about your requirements..." class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600"></textarea>
                    </div>
                    <button type="submit" id="contact-submit-btn" class="w-full py-3 rounded-xl bg-emerald-700 hover:bg-emerald-800 border-2 border-emerald-800 text-white font-extrabold text-xs transition-colors">
                        Submit Inquiry
                    </button>
                    <div id="contact-status-banner" class="hidden p-3 rounded-xl text-center text-xs font-bold"></div>
                </form>
            </div>

            <!-- Office Info (100% Hydrated from Firestore siteSettings) -->
            <div class="lg:col-span-5 space-y-5">
                <div class="bg-white p-6 rounded-3xl border-2 border-slate-300 shadow-sm space-y-4">
                    <span class="inline-block bg-emerald-50 border border-emerald-300 text-emerald-800 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Head Office</span>
                    <h2 class="shared-site-name text-xl font-extrabold outfit text-slate-900">Contact Desk</h2>
                    <div class="space-y-3 text-xs text-slate-700">
                        <div class="flex items-start gap-2.5">
                            <i class="fa-solid fa-location-dot text-emerald-700 mt-0.5"></i>
                            <span class="shared-address-text leading-relaxed"></span>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-phone text-emerald-700"></i>
                            <a href="contact.html" class="shared-phone-link font-bold text-slate-900 hover:text-emerald-700"><span class="shared-phone-text"></span></a>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-envelope text-emerald-700"></i>
                            <a href="contact.html" class="shared-email-link font-semibold text-slate-700 hover:text-emerald-700"><span class="shared-email-text"></span></a>
                        </div>
                    </div>
                    <a href="contact.html" target="_blank" rel="noopener" class="shared-wa-link w-full py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-sm"></i> Chat on WhatsApp
                    </a>
                </div>

                <!-- Dynamic Google Map Embed (Hydrated from Firestore siteSettings.contact.googleMapsEmbedUrl) -->
                <div id="contact-map-wrap" class="hidden h-72 rounded-3xl border-2 border-slate-300 overflow-hidden bg-slate-200 shadow-sm">
                    <iframe id="contact-map-iframe" src="about:blank" width="100%" height="100%" style="border:0;" allowfullscreen loading="lazy" title="Office Location"></iframe>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const [settings, projects] = await Promise.all([
                window.KaghanDB.getSiteSettings(),
                window.KaghanDB.getProjects(true)
            ]);

            if (settings && settings.siteName) {
                document.title = `Contact Us | ${settings.siteName}`;
            }

            if (settings && settings.contact && settings.contact.googleMapsEmbedUrl) {
                const mapWrap = document.getElementById('contact-map-wrap');
                const iframe = document.getElementById('contact-map-iframe');
                iframe.src = settings.contact.googleMapsEmbedUrl;
                mapWrap.classList.remove('hidden');
            }

            const sel = document.getElementById('contact-type');
            if (sel && projects.length) {
                sel.innerHTML = projects.map(pr => `<option value="${pr.name}">${pr.name}</option>`).join('') +
                    `<option value="General Property Consultation">General Property Consultation</option>`;
            }
        });

        document.getElementById('contact-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('contact-submit-btn');
            const banner = document.getElementById('contact-status-banner');
            btn.disabled = true;
            btn.innerText = 'Sending...';
            try {
                await window.KaghanDB.createLead({
                    name: document.getElementById('contact-name').value.trim(),
                    phone: document.getElementById('contact-phone').value.trim(),
                    email: document.getElementById('contact-email').value.trim(),
                    propertyTitle: document.getElementById('contact-type').value,
                    message: document.getElementById('contact-message').value.trim(),
                    sourcePage: 'contact.html',
                    status: 'new'
                });
                banner.innerText = 'Thank you! Your inquiry has been saved. Our team will contact you shortly.';
                banner.className = 'p-3 rounded-xl text-center text-xs font-bold bg-emerald-50 border border-emerald-300 text-emerald-800 block';
                e.target.reset();
            } catch (err) {
                banner.innerText = 'Could not submit inquiry. Please try again.';
                banner.className = 'p-3 rounded-xl text-center text-xs font-bold bg-rose-50 border border-rose-300 text-rose-700 block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Submit Inquiry';
            }
        });
    </script>
</body>
</html>
