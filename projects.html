<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listings | Kaghan Properties</title>
    <meta name="description" content="Browse verified plots and properties in DHA Margalla Enclave and Islamabad with interactive pinned plot maps.">
    <meta name="theme-color" content="#077943">
    <link rel="canonical" href="https://kaghanproperties.com/projects.html">

    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/shared.js"></script>
    <script src="assets/js/plot-map.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="site-header"></div>

    <!-- Single Compact Filter Bar with Prominent Borderlines -->
    <section class="bg-white border-b-2 border-slate-300 sticky top-[62px] sm:top-[95px] z-30 shadow-xs">
        <div class="market-container py-3.5 flex flex-wrap items-center justify-between gap-2.5 text-xs">
            <div class="flex flex-wrap items-center gap-2 flex-1">
                <div class="relative min-w-[180px] flex-1 max-w-xs">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-emerald-700 text-[11px]"></i>
                    <input type="text" id="filter-keyword" oninput="applyFilters()" placeholder="Search plot #, ballot, or area..." class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl pl-8 pr-3 py-2 font-semibold text-slate-800 focus:outline-none focus:border-emerald-600">
                </div>

                <select id="filter-project" onchange="applyFilters()" class="bg-slate-50 border-2 border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800 focus:outline-none focus:border-emerald-600">
                    <option value="all">All Projects</option>
                </select>

                <select id="filter-type" onchange="applyFilters()" class="bg-slate-50 border-2 border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800 focus:outline-none focus:border-emerald-600">
                    <option value="all">All Types</option>
                    <option value="residential_plot">Residential Plots</option>
                    <option value="commercial_plot">Commercial Plots</option>
                    <option value="all_homes">Homes</option>
                </select>

                <select id="filter-price-range" onchange="applyFilters()" class="bg-slate-50 border-2 border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800 focus:outline-none focus:border-emerald-600">
                    <option value="all">Any Price</option>
                    <option value="0-30000000">Under 3 Cr</option>
                    <option value="30000000-100000000">3 – 10 Cr</option>
                    <option value="100000000-999999999">10 Cr+</option>
                </select>

                <select id="results-sort" onchange="applyFilters()" class="bg-slate-50 border-2 border-slate-300 rounded-xl px-3 py-2 font-bold text-slate-800 focus:outline-none focus:border-emerald-600">
                    <option value="default">Sort: Featured</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                </select>

                <button type="button" onclick="resetFilters()" title="Reset" class="p-2 rounded-xl border-2 border-slate-300 bg-white text-slate-600 hover:border-emerald-600 hover:text-emerald-700">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>

            <!-- List / Map View Toggle -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border-2 border-slate-300 shrink-0">
                <button type="button" id="view-btn-grid" onclick="setViewMode('grid')" class="px-3 py-1.5 rounded-lg font-bold bg-white border border-slate-300 text-emerald-700 shadow-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-grip"></i> Listings
                </button>
                <button type="button" id="view-btn-map" onclick="setViewMode('map')" class="px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
                    <i class="fa-solid fa-map-pin text-emerald-600"></i> Plot Map
                </button>
            </div>
        </div>
    </section>

    <main class="market-container py-8 flex-1 space-y-6">
        <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b-2 border-slate-300">
            <div>
                <span class="text-[11px] font-extrabold uppercase tracking-widest text-emerald-700">Islamabad Verified Inventory</span>
                <h1 class="text-xl sm:text-2xl font-extrabold outfit text-slate-900">
                    <span id="results-count" class="text-emerald-700">0</span> Verified Listings
                </h1>
            </div>
            <a href="project-detail.html?slug=dha-margalla-enclave#payment-plan" class="px-4 py-2 rounded-xl bg-white border-2 border-slate-300 hover:border-emerald-600 text-xs font-extrabold text-emerald-800 transition-colors">
                Official Payment Plans &rarr;
            </a>
        </div>

        <!-- Map View Container (Hidden by default unless ?tool=plot-finder or toggled) -->
        <div id="listings-map-view" class="hidden">
            <div id="listings-plot-map-root"></div>
        </div>

        <!-- Listings Grid -->
        <div id="properties-card-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-16 text-center text-slate-400 text-xs">
                <i class="fa-solid fa-circle-notch fa-spin text-emerald-600 text-lg mr-2"></i> Loading listings...
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        let allProperties = [];
        let filteredProperties = [];
        let listingsMap = null;
        let currentView = 'grid';

        function setViewMode(mode) {
            currentView = mode;
            const gridEl = document.getElementById('properties-card-list');
            const mapWrap = document.getElementById('listings-map-view');
            const btnGrid = document.getElementById('view-btn-grid');
            const btnMap = document.getElementById('view-btn-map');

            if (mode === 'map') {
                gridEl.classList.add('hidden');
                mapWrap.classList.remove('hidden');
                btnMap.className = 'px-3 py-1.5 rounded-lg font-bold bg-white text-emerald-700 shadow-xs flex items-center gap-1.5';
                btnGrid.className = 'px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
                if (!listingsMap && window.KaghanPlotMap) {
                    listingsMap = window.KaghanPlotMap.create('listings-plot-map-root', {
                        mode: 'multi',
                        properties: filteredProperties,
                        height: '580px'
                    });
                } else if (listingsMap) {
                    listingsMap.updateProperties(filteredProperties);
                    setTimeout(() => listingsMap.invalidateSize(), 150);
                }
            } else {
                mapWrap.classList.add('hidden');
                gridEl.classList.remove('hidden');
                btnGrid.className = 'px-3 py-1.5 rounded-lg font-bold bg-white text-emerald-700 shadow-xs flex items-center gap-1.5';
                btnMap.className = 'px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
            }
        }

        function resetFilters() {
            document.getElementById('filter-keyword').value = '';
            const projSel = document.getElementById('filter-project');
            if (projSel) projSel.value = 'all';
            document.getElementById('filter-type').value = 'all';
            document.getElementById('filter-price-range').value = 'all';
            document.getElementById('results-sort').value = 'default';
            applyFilters();
        }

        function getPrimaryPhoto(p) {
            if (Array.isArray(p.images) && p.images.length) {
                const first = p.images.find(i => !i.type || i.type === 'image') || p.images[0];
                if (first) return typeof first === 'string' ? first : (first.url || 'assets/images/dha-margalla-hero.jpg');
            }
            if (Array.isArray(p.gallery)) {
                const img = p.gallery.find(g => g.type === 'image' && g.url);
                if (img) return img.url;
            }
            return 'assets/images/dha-margalla-hero.jpg';
        }

        function hasListingVideo(p) {
            return (Array.isArray(p.videos) && p.videos.length > 0) ||
                   (Array.isArray(p.gallery) && p.gallery.some(g => g.type === 'video'));
        }

        function applyFilters() {
            const kw = (document.getElementById('filter-keyword').value || '').trim().toLowerCase();
            const projFilter = document.getElementById('filter-project') ? document.getElementById('filter-project').value : 'all';
            const type = document.getElementById('filter-type').value;
            const priceRange = document.getElementById('filter-price-range').value;
            const sort = document.getElementById('results-sort').value;

            filteredProperties = allProperties.filter(p => {
                if (projFilter !== 'all' && p.projectId !== projFilter && !(!p.projectId && p.societyId === projFilter)) return false;
                if (kw) {
                    const hay = `${p.title || ''} ${p.area || ''} ${p.sector || ''} ${p.plotNumber || ''} ${p.plotSector || ''} ${p.ballotPhase || ''}`.toLowerCase();
                    if (!hay.includes(kw)) return false;
                }
                if (type !== 'all') {
                    const pt = (p.type || '').toLowerCase();
                    const pc = (p.category || '').toLowerCase();
                    if (type === 'residential_plot' && !(pt.includes('residential') || (pt.includes('plot') && !pt.includes('comm') && !pc.includes('comm')))) return false;
                    if (type === 'commercial_plot' && !(pt.includes('comm') || pc.includes('comm'))) return false;
                    if (type === 'all_homes' && !['house', 'flat', 'apartment', 'penthouse', 'villa'].includes(pt)) return false;
                }
                if (priceRange !== 'all') {
                    const [minP, maxP] = priceRange.split('-').map(Number);
                    if ((p.price || 0) < minP || (p.price || 0) > maxP) return false;
                }
                return true;
            });

            if (sort === 'price-asc') filteredProperties.sort((a, b) => (a.price || 0) - (b.price || 0));
            else if (sort === 'price-desc') filteredProperties.sort((a, b) => (b.price || 0) - (a.price || 0));

            document.getElementById('results-count').innerText = filteredProperties.length;
            renderCards();
            if (listingsMap) listingsMap.updateProperties(filteredProperties);
        }

        function renderCards() {
            const container = document.getElementById('properties-card-list');
            if (!container) return;

            if (filteredProperties.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-12 text-center rounded-2xl border border-slate-200 space-y-3">
                        <p class="font-bold text-slate-700">No matching listings found.</p>
                        <button onclick="resetFilters()" class="bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl">Reset Filters</button>
                    </div>`;
                return;
            }

            container.innerHTML = filteredProperties.map(p => {
                const img = getPrimaryPhoto(p);
                const hasVid = hasListingVideo(p);
                const price = window.KaghanSharedUI ? window.KaghanSharedUI.formatPrice(p.price) : `PKR ${Number(p.price || 0).toLocaleString()}`;
                const sizeText = p.sqYards ? `${p.sqYards} Sq Yds` : (p.size ? `${p.size} ${p.sizeUnit || 'Marla'}` : '');
                const url = p.isNewProject
                    ? `project-detail.html?slug=${encodeURIComponent(p.slug || p.id)}`
                    : `property.html?slug=${encodeURIComponent(p.slug || p.id)}`;
                const mapUrl = `property.html?slug=${encodeURIComponent(p.slug || p.id)}#plot-map-section`;
                const waUrl = `https://wa.me/923340091127?text=${encodeURIComponent('Hi, I am interested in ' + p.title + (p.plotNumber ? ' (' + p.plotNumber + ')' : ''))}`;

                return `
                    <article class="kp-card rounded-2xl overflow-hidden flex flex-col group">
                        <a href="${url}" class="relative h-52 bg-slate-100 overflow-hidden block border-b-2 border-slate-200">
                            <img src="${img}" alt="${p.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            ${p.plotNumber ? `<span class="absolute top-3 left-3 bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow flex items-center gap-1"><i class="fa-solid fa-map-pin text-[10px]"></i> ${p.plotNumber}</span>` : ''}
                            ${hasVid ? `<span class="absolute top-3 right-3 bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow flex items-center gap-1"><i class="fa-brands fa-youtube"></i> Video</span>` : ''}
                            ${sizeText ? `<span class="absolute bottom-3 right-3 bg-slate-900/85 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg">${sizeText}</span>` : ''}
                        </a>
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <div class="text-xl font-extrabold outfit text-emerald-800">${price}</div>
                                <h2 class="font-bold text-sm text-slate-900 line-clamp-1 mt-0.5 group-hover:text-emerald-700 transition-colors">
                                    <a href="${url}">${p.title}</a>
                                </h2>
                                <div class="text-xs text-slate-500 mt-1 flex items-center gap-1 line-clamp-1">
                                    <i class="fa-solid fa-location-dot text-emerald-600 text-[10px]"></i>
                                    <span>${p.plotSector || p.sector || p.area || 'DHA Margalla Enclave'}, ${p.city || 'Islamabad'}</span>
                                </div>
                            </div>
                            <div class="pt-3 border-t border-slate-100 flex items-center gap-2">
                                <a href="${url}" class="flex-1 text-center py-2 rounded-xl bg-slate-900 hover:bg-emerald-700 text-white text-xs font-bold transition-colors">Details</a>
                                <a href="${mapUrl}" title="View Plot Pin on Map" class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 text-xs font-bold transition-colors flex items-center gap-1">
                                    <i class="fa-solid fa-map-pin text-emerald-600"></i> Map
                                </a>
                                <a href="${waUrl}" target="_blank" rel="noopener" class="py-2 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white text-xs font-bold transition-colors">
                                    <i class="fa-brands fa-whatsapp text-sm"></i>
                                </a>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const kw = params.get('keyword') || params.get('area') || params.get('q') || '';
            if (kw) document.getElementById('filter-keyword').value = kw;

            const typeParam = params.get('type');
            if (typeParam && ['residential_plot', 'commercial_plot', 'all_homes'].includes(typeParam)) {
                document.getElementById('filter-type').value = typeParam;
            }
            const priceParam = params.get('priceRange');
            if (priceParam && ['0-30000000', '30000000-100000000', '100000000-999999999'].includes(priceParam)) {
                document.getElementById('filter-price-range').value = priceParam;
            }

            const [projects, props] = await Promise.all([
                (window.KaghanDB && window.KaghanDB.getProjects) ? window.KaghanDB.getProjects(true) : Promise.resolve([]),
                (window.KaghanDB && window.KaghanDB.getProperties) ? window.KaghanDB.getProperties() : Promise.resolve([])
            ]);

            const projSel = document.getElementById('filter-project');
            if (projSel && projects.length) {
                projSel.innerHTML = `<option value="all">All Projects</option>` + projects.map(pr => `<option value="${pr.id}">${pr.name}</option>`).join('');
                const projectParam = params.get('project');
                if (projectParam && projects.some(pr => pr.id === projectParam || pr.slug === projectParam)) {
                    const matched = projects.find(pr => pr.id === projectParam || pr.slug === projectParam);
                    projSel.value = matched.id;
                }
            }

            allProperties = props || [];
            applyFilters();

            if (params.get('tool') === 'plot-finder' || params.get('view') === 'map') {
                setViewMode('map');
            }

            window.addEventListener('marketStateChanged', renderCards);
        });
    </script>
</body>
</html>
